name: CI
on:
  push:
  pull_request:

jobs:
  central:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: central } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: central/package-lock.json }
      - run: npm ci
      - run: npx tsc -p tsconfig.worker.json
      - run: npx tsc -p tsconfig.app.json
      - run: npx vitest run
      - run: npx vite build

  gateway:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: gateway } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24', cache-dependency-path: gateway/go.sum }
      - run: go vet ./...
      - run: go test ./...
      - run: ./build.sh
