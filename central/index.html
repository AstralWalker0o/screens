<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)" />
    <meta name="referrer" content="no-referrer" />
    <title>Screens</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232370cd'/%3E%3Crect x='7' y='9' width='18' height='12' rx='2' fill='none' stroke='white' stroke-width='2.2'/%3E%3Cpath d='M12 25h8' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme before first paint so there is no light/dark flash.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Screens needs JavaScript turned on.</noscript>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
